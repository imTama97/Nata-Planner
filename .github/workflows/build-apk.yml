name: Build Nata Planner APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q Nata_Planner_Source_Baru.zip -d extracted-source
          echo "PROJECT_DIR=extracted-source/nata_planner_source" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install
        working-directory: extracted-source/nata_planner_source

      - name: Build web app
        run: npm run build
        working-directory: extracted-source/nata_planner_source

      - name: Add Android platform
        run: npx cap add android
        working-directory: extracted-source/nata_planner_source

      - name: Sync Android project
        run: npx cap sync android
        working-directory: extracted-source/nata_planner_source

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        working-directory: extracted-source/nata_planner_source/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nata-planner-debug-apk
          path: extracted-source/nata_planner_source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
